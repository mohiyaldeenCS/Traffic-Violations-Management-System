<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستعلام عن مخالفة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- الشريط الجانبي -->
        <nav class="col-md-2 sidebar">
            <h4 class="text-center"><i class="fas fa-car"></i>المخالفات المرورية</h4>
            <hr class="custom-hr">
            <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="cameras.html"><i class="fas fa-camera"></i> الكاميرات</a>
            <a href="violation.html" class="btn-active"><i class="fas fa-search"></i> الاستعلام</a>
            <a href="users.html"><i class="fas fa-users"></i> المستخدمين</a>
            <a href="login.html" class="text-danger"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>

        <!-- المحتوى الرئيسي -->
        <main class="col-md-10 content">
            <div class="d-flex justify-content-between align-items-center">
                <div class="row-md-6">
                    <div class="stat-box2">
                        <h2>الاستعلام عن مخالفة</h2>
                    </div>
                </div>
                
                <div class="user-profile">
                    <span>Abdalmalik sawlan</span>
                    <a href="profile.html"> <i class="fas fa-user-circle profile-icon" ></i> </a>
                    
                </div>
            </div>
            
            <hr class="custom-hr">

            <h2>إظهار معلومات المخالفة</h2>

            <!-- مربع البحث -->
            <div class="search-box">
                <input type="text" id="violationNumber" placeholder="أدخل رقم المخالفة">
                <button onclick="fetchViolation()"><i class="fas fa-search"></i> بحث</button>
            </div>
            <div class="vid"> 
                <h4 id="violationID"></h4>
                <br>
            </div>
            
            <!-- عرض بيانات المخالفة -->
            <div id="violationDetails" class="violation-info" style="display: none;">

                

                <div class="row">
                    <!-- صورة المخالفة -->
                    <div class="col-md-6">
                        <img src="12.png" id="violationImage" class="img-fluid">
                        <p><strong>نوع المخالفة:</strong> <span id="violationType"></span></p>
                        <p><strong>مكان المخالفة:</strong> <span id="violationLocation"></span></p>
                        <p><strong>الوقت والتاريخ:</strong> <span id="violationDate"></span></p>
                        <p><strong>غرامة المخالفة:</strong> <span id="violationFine"></span> ريال</p>
                    </div>

                    <!-- معلومات اللوحة -->
                    <div class="col-md-6">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>رقم اللوحة</th>
                                    <th>المنطقة</th>
                                    <th>النوع</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td id="plateNumber"></td>
                                    <td id="plateRegion"></td>
                                    <td id="plateType"></td>
                                </tr>
                            </tbody>
                        </table>
                        <img src="12.png" id="plateImage" class="img-fluid">
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
