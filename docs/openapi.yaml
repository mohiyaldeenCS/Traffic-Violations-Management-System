components:
  schemas:
    ActionEnum:
      enum:
      - submit
      - review
      - approve
      - issue
      - cancel
      - close
      type: string
      description: |-
        * `submit` - submit
        * `review` - review
        * `approve` - approve
        * `issue` - issue
        * `cancel` - cancel
        * `close` - close
    Appeal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        case:
          type: string
          format: uuid
        reference:
          type: string
          readOnly: true
        reason:
          type: string
          maxLength: 4000
        status:
          $ref: '#/components/schemas/AppealStatusEnum'
        decision_reason:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
          readOnly: true
      required:
      - attachments
      - case
      - created_at
      - id
      - reason
      - reference
    AppealStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected
    AppealSubmissionRequest:
