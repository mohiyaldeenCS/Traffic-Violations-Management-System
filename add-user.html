<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مستخدم</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- الشريط الجانبي -->
        <nav class="col-md-2 sidebar">
            <h4 class="text-center"><i class="fas fa-car"></i>المخالفات المرورية</h4>
            <hr class="custom-hr">
            <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="cameras.html"><i class="fas fa-camera"></i> الكاميرات</a>
            <a href="violation.html"><i class="fas fa-search"></i> الاستعلام</a>
            <a href="users.html" class="btn-active"><i class="fas fa-users"></i> المستخدمون</a>
            <a href="login.html" class="text-danger"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>

        <!-- المحتوى الرئيسي -->
        <main class="col-md-10 content">
            <div class="d-flex justify-content-between align-items-center">
                <div class="row-md-6">
                    <div class="stat-box2">
                       <h2>المستخدمين</h2> 
                    </div>
                </div>
                
                <div class="user-profile">
                    <span>Abdalmalik sawlan</span>
                    <a href="profile.html"> <i class="fas fa-user-circle profile-icon" ></i> </a>
                    
                </div>
            </div>
            
            <hr class="custom-hr">

            <h2>إضافة مستخدم</h2>
            <hr>

            <div class="add-user-form">
                <form action="#" method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="username"><i class="fas fa-user"></i> اسم المستخدم</label>
                            <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password"><i class="fas fa-lock"></i> كلمة السر</label>
                            <input type="password" id="password" class="form-control" placeholder="أدخل كلمة السر" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <label for="phone"><i class="fas fa-phone"></i> رقم الهاتف</label>
                            <input type="text" id="phone" class="form-control" placeholder="أدخل رقم الهاتف" required>
                        </div>
                        <div class="col-md-6">
                            <label for="jobId"><i class="fas fa-id-badge"></i> الرقم الوظيفي</label>
                            <input type="text" id="jobId" class="form-control" placeholder="أدخل الرقم الوظيفي" required>
                        </div>
                    </div>

                    <div class="account-type">
                        <label><i class="fas fa-user-shield"></i> نوع الحساب:</label>
                        <div class="form-check form-check-inline">
                            <input class="custom-checkbox" type="checkbox" id="admin" value="Admin">
                            <label class="form-check-label" for="admin">Admin</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="custom-checkbox" type="checkbox" id="user" value="User">
                            <label class="form-check-label" for="user">مستخدم عادي</label>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> إضافة</button>
                        <button type="button" class="btn btn-danger" onclick="cancelAddUser()"><i class="fas fa-times"></i> إلغاء</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
