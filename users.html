<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- الشريط الجانبي -->
        <nav class="col-md-2 sidebar">
            <h4 class="text-center"><i class="fas fa-car"></i>المخالفات المرورية</h4>
            <hr class="custom-hr">
            <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="cameras.html"><i class="fas fa-camera"></i> الكاميرات</a>
            <a href="violation.html"><i class="fas fa-search"></i> الاستعلام</a>
            <a href="users.html" class="btn-active"><i class="fas fa-users"></i> المستخدمين</a>
            <a href="login.html" class="text-danger"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>

        <!-- المحتوى الرئيسي -->
        <main class="col-md-10 content">
            <div class="d-flex justify-content-between align-items-center">
                <div class="row-md-6">
                    <div class="stat-box2">
                        <h2>المستخدمين</h2>
                    </div>
                </div>
                
                <div class="user-profile">
                    <span>Abdalmalik sawlan</span>
                    <a href="profile.html"> <i class="fas fa-user-circle profile-icon" ></i> </a>
                    
                </div>
            </div>
            
            <hr class="custom-hr">


            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>إدارة المستخدمين</h3>
                <button class="btn btn-primary" onclick="openAddUserPage()">
                    <i class="fas fa-user-plus"></i> إضافة مستخدم
                </button>
            </div>

            <!-- جدول المستخدمين -->
            <div class="user-card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>اسم المستخدم</th>
                                <th>كلمة السر</th>
                                <th>رقم الهاتف</th>
                                <th>الحالة</th>
                                <th>نوع الحساب</th>
                                <th>التفاعل</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- سيتم ملء البيانات ديناميكيًا -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
