<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكاميرات الراصدة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- الشريط الجانبي -->
        <nav class="col-md-2 sidebar">
            <h4 class="text-center"><i class="fas fa-car"></i>المخالفات المرورية</h4>
            <hr class="custom-hr">
            <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="cameras.html" class="btn-active"><i class="fas fa-camera"></i> الكاميرات</a>
            <a href="violation.html"><i class="fas fa-search"></i> الاستعلام</a>
            <a href="users.html"><i class="fas fa-users"></i> المستخدمين</a>
            <a href="login.html" class="text-danger"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>

        <!-- المحتوى الرئيسي -->
        <main class="col-md-10 content">
            <div class="d-flex justify-content-between align-items-center">
                <div class="row-md-6">
                    <div class="stat-box2">
                        <h2>الكاميرات الراصدة</h2>
                    </div>
                </div>
                
                <div class="user-profile">
                    <span>Abdalmalik sawlan</span>
                    <a href="profile.html"> <i class="fas fa-user-circle profile-icon" ></i> </a>
                    
                </div>
            </div>
            
            <hr class="custom-hr">

            <h2>الكاميرات الراصدة المتاحة</h2>
            
            <div class="mb-5">
                <select id="cameraSelect" class="form-select">
                    <option value="">اختر كاميرا للاتصال</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="stat-box text-center">
                        <i class="fas fa-camera-slash fa-5x"></i>
                        <h3 id="cameraMessage">لم يتم الاتصال بالكاميرا</h3>
                        <img src="12.png" id="violationImage" class="img-fluid">
                        
                    </div>
                </div>
                <!-- معلومات الاتصال -->
                <div class="col-md-4">
                    <div class="stat-box">
                        <h3>معلومات الاتصال</h3>
                        <p><strong>الموقع:</strong> <span id="location">لم يتم الاختيار</span></p>
                        <p><strong>حالة الاتصال:</strong> <span id="status" class="text-danger">غير متصل ●</span></p>
                    </div>
                </div>
                
                <!-- صورة عدم الاتصال -->
                
            </div>
        </main>
    </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
