<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="login-container">
    <h2><i class="fas fa-lock"></i> استعادة كلمة المرور</h2>
    <form id="forgotPasswordForm">
        <div class="input-group">
            <input type="email" id="email" class="form-control" placeholder="أدخل البريد الإلكتروني أو اسم المستخدم" required>
            <span class="input-icon"><i class="fas fa-envelope"></i></span>
            
        </div>

        <button type="button" class="btn btn-primary" onclick="sendVerificationCode()">إرسال رمز التحقق</button>

        <div id="verificationSection" style="display: none;">
            <div class="input-group">
                <input type="text" id="verificationCode" class="form-control" placeholder="أدخل رمز التحقق" required>
                <span class="input-icon"><i class="fas fa-key"></i></span>
                
            </div>

            <div class="input-group">
                <input type="password" id="newPassword" class="form-control" placeholder="أدخل كلمة المرور الجديدة" required>
                <span class="input-icon"><i class="fas fa-lock"></i></span>
                
            </div>

            <button type="submit" class="btn btn-success">إعادة تعيين كلمة المرور</button>
        </div>

        <p class="back-to-login">
            <a href="login.html">العودة إلى تسجيل الدخول</a>
        </p>
    </form>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
