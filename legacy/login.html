<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="login-container">
    <h2><i class="fas fa-user-lock"></i> تسجيل الدخول</h2>

    <!-- نموذج تسجيل الدخول -->
    <form id="loginForm" action="login.php" method="POST">
        
        <div class="input-group">
            <input type="text" name="username" class="form-control" placeholder="اسم المستخدم" required>
            <span class="input-icon"><i class="fas fa-user"></i></span>
        </div>
        
        <div class="input-group">
            <input type="password" name="password" class="form-control" placeholder="كلمة المرور" required>
            <span class="input-icon"><i class="fas fa-lock"></i></span>
        </div>
        
        <p class="forgot-password">
            <a href="forgot-password.html">هل نسيت كلمة المرور؟</a>
        </p>
        <p class="register">
            <a href="register.php">إنشاء حساب جديد</a>
        </p>
        
        <div class="form-buttons">
            <button type="button" class="btn btn-danger" onclick="cancelLogin()"><i class="fas fa-times"></i> إلغاء</button>
            <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
            
        </div>
    </form>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
