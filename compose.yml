name: rasd-evaluation
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rasd
      POSTGRES_USER: rasd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasd -d rasd"]
      interval: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    volumes: [cache:/data]
  api:
    build: ./backend
    environment:
      APP_ENV: development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      DATABASE_URL: postgresql://rasd:${POSTGRES_PASSWORD}@db:5432/rasd
      REDIS_URL: redis://redis:6379/0
      EVIDENCE_ROOT: /data/evidence
      SIMULATION_MODE: ${SIMULATION_MODE:-0}
    volumes: [evidence:/data/evidence]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
volumes:
  database:
  evidence:
  cache:

